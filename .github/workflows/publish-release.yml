name: Build and publish TapForge release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Check VERSION matches the tag
        shell: powershell
        run: |
          $version = (Get-Content -Raw VERSION).Trim()
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "VERSION file says $version but the tag is $env:GITHUB_REF_NAME." }

      - name: Build single-file TapForge.exe
        shell: powershell
        run: |
          & '.\Build TapForge.ps1'

      - name: Package legacy portable ZIP (lets older TapForge versions update)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $stage = Join-Path $env:RUNNER_TEMP 'TapForge-Portable'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item TapForge.exe, AutoClicker.ps1, TapForge.ico, TapForgeLogo.png, VERSION, 'Launch AutoClicker.bat', README.txt -Destination $stage
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath "TapForge-$tag-Portable.zip" -CompressionLevel Optimal

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GITHUB_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $notes = if (Test-Path RELEASE_NOTES.md) { (Get-Content -Raw RELEASE_NOTES.md).Trim() } else { '' }
          $body = @{ tag_name = $tag; name = "TapForge $tag"; body = $notes; generate_release_notes = [string]::IsNullOrWhiteSpace($notes) } | ConvertTo-Json
          $release = Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases" -Headers $headers -ContentType 'application/json; charset=utf-8' -Body ([System.Text.Encoding]::UTF8.GetBytes($body))
          $base = $release.upload_url -replace '\{\?name,label\}$', ''
          Invoke-RestMethod -Method Post -Uri ($base + '?name=TapForge.exe') -Headers $headers -ContentType 'application/octet-stream' -InFile 'TapForge.exe' | Out-Null
          $zip = "TapForge-$tag-Portable.zip"
          Invoke-RestMethod -Method Post -Uri ($base + '?name=' + [uri]::EscapeDataString($zip)) -Headers $headers -ContentType 'application/zip' -InFile $zip | Out-Null
